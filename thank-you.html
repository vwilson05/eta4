<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Thank you | eta4</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <style>
        .thanks { min-height: 100vh; display: grid; place-items: center; background: var(--gray-50); padding: 2rem 1rem; }
        .thanks-card { max-width: 560px; background: var(--white); border-radius: 20px; padding: 3rem 2rem; box-shadow: var(--shadow-lg); text-align: center; }
        .thanks-card h1 { font-family: var(--font-heading); font-size: 2rem; color: var(--dark); margin-bottom: 1rem; }
        .thanks-card p { color: var(--text-light); margin-bottom: 1rem; }
        .thanks-card .btn { margin-top: 1rem; }
    </style>
</head>
<body>
    <main class="thanks">
        <div class="thanks-card">
            <h1>Thank you.</h1>
            <p>Your gift is on its way to a classroom in Hue. Stripe will email your receipt; keep it for your taxes. eta4 is a 501(c)(3) nonprofit, EIN 26-3633243.</p>
            <p>Questions or a dedication in someone's honor? Write to <a href="mailto:info@eta4.org">info@eta4.org</a>.</p>
            <a href="/" class="btn btn-primary">Back to eta4.org</a>
        </div>
    </main>
</body>
</html>
